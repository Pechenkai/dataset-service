global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8080
          - api-read1:8080
          - api-read2:8080

  - job_name: api-mirror
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-mirror:8080
          - api-mirror-read1:8080
          - api-mirror-read2:8080
