worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    upstream ppo_api {
        server api:8080;
    }

    upstream ppo_legacy_ui {
        server legacy-ui:8090;
    }

    upstream ppo_admin_ui {
        server adminer:8080;
    }

    server {
        listen 80;
        server_name _;
        charset utf-8;

        root /usr/share/nginx/html;
        index index.html;

        # Static pages
        location = / {
            try_files /static/index.html =404;
        }

        location = /reserved {
            return 302 /reserved/;
        }

        location /reserved/ {
            try_files /static/index.html =404;
        }

        location /static/ {
            expires 1h;
            add_header Cache-Control "public";
            try_files $uri $uri/ =404;
        }

        location = /managment {
            try_files /static/managment.html =404;
        }

        location = /managment/ {
            try_files /static/managment.html =404;
        }

        # Documentation
        location = /documentation {
            default_type text/markdown;
            try_files /readme.md =404;
        }

        # Swagger landing pages
        location = /api/v1 {
            default_type text/html;
            try_files /static/swagger/v1.html =404;
        }

        location = /api/v2 {
            default_type text/html;
            try_files /static/swagger/v2.html =404;
        }

        # REST API upstreams
        location /api/v1/ {
            proxy_pass http://ppo_api/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /api/v2/ {
            proxy_pass http://ppo_api/api/v2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /swagger/ {
            proxy_pass http://ppo_api/swagger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Legacy UI routing
        location = /legacy {
            proxy_pass http://ppo_legacy_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /legacy/ {
            proxy_pass http://ppo_legacy_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin UI routing
        location = /admin {
            proxy_pass http://ppo_admin_ui/;
            proxy_set_header Host $host;
        }

        location /admin/ {
            proxy_pass http://ppo_admin_ui/;
            proxy_set_header Host $host;
        }

        # Status endpoint
        location = /status {
            stub_status;
            access_log off;
        }
    }
}
