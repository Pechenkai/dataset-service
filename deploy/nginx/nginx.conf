worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset utf-8;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream $upstream_addr status $upstream_status cache $upstream_cache_status '
                      'rt=$request_time urt=$upstream_response_time req_id=$request_id';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/rss+xml text/javascript image/svg+xml;

    proxy_cache_path /var/cache/nginx/ppo levels=1:2 keys_zone=ppo_cache:50m max_size=512m inactive=15m use_temp_path=off;

    map $request_method $main_api_upstream {
        GET  ppo_api_read_pool;
        HEAD ppo_api_read_pool;
        default ppo_api_write;
    }

    map $request_method $mirror_api_upstream {
        GET  ppo_api_read_pool_mirror;
        HEAD ppo_api_read_pool_mirror;
        default ppo_api_write_mirror;
    }

    map $request_uri $skip_cache {
        ~^/api/ 1;
        ~^/mirror/api/ 1;
        default 0;
    }

    upstream ppo_api_write {
        server api:8080;
    }

    upstream ppo_api_read_pool {
        server api:8080 weight=2;
        server api-read1:8080 weight=1;
        server api-read2:8080 weight=1;
    }

    upstream ppo_api_write_mirror {
        server api-mirror:8080;
    }

    upstream ppo_api_read_pool_mirror {
        server api-mirror:8080 weight=2;
        server api-mirror-read1:8080 weight=1;
        server api-mirror-read2:8080 weight=1;
    }

    upstream ppo_legacy_ui {
        server legacy-ui:8090;
    }

    upstream ppo_legacy_ui_mirror {
        server legacy-ui-mirror:8090;
    }

    upstream ppo_admin_ui {
        server adminer:8080;
    }

    server {
        listen 80;
        server_name _;
        charset utf-8;

        root /usr/share/nginx/html;
        index index.html;

        add_header Server "PPO Dataset Platform" always;
        add_header X-App-Gateway "PPO Dataset Platform" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        location = / {
            try_files /static/index.html =404;
        }

        location = /reserved {
            return 302 /reserved/;
        }

        location /reserved/ {
            try_files /static/index.html =404;
        }

        location /static/ {
            expires 1h;
            add_header Cache-Control "public";
            try_files $uri $uri/ =404;
        }

        location = /managment {
            try_files /static/managment.html =404;
        }

        location = /managment/ {
            try_files /static/managment.html =404;
        }

        location = /documentation {
            default_type text/markdown;
            charset utf-8;
            add_header Content-Type "text/markdown; charset=utf-8" always;
            add_header Cache-Control "no-cache";
            try_files /readme.md =404;
        }

        location = /api/v1 {
            default_type text/html;
            try_files /static/swagger/v1.html =404;
        }

        location = /api/v2 {
            default_type text/html;
            try_files /static/swagger/v2.html =404;
        }

        location /api/v1/ {
            proxy_pass http://$main_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_no_cache $skip_cache;
            proxy_cache_bypass $skip_cache;
            proxy_cache ppo_cache;
            add_header X-Upstream-Pool $main_api_upstream always;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location /api/v2/ {
            proxy_pass http://$main_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_no_cache $skip_cache;
            proxy_cache_bypass $skip_cache;
            proxy_cache ppo_cache;
            add_header X-Upstream-Pool $main_api_upstream always;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location /swagger/ {
            proxy_pass http://ppo_api_write/swagger/;
            add_header X-Upstream-Pool ppo_api_write always;
        }

        location = /legacy {
            return 302 /legacy/;
        }

        location /legacy/ {
            rewrite ^/legacy(/.*)$ $1 break;
            proxy_pass http://ppo_legacy_ui;
            add_header X-Upstream-Pool legacy-main always;
        }

        location = /admin {
            proxy_pass http://ppo_admin_ui/;
        }

        location /admin/ {
            proxy_pass http://ppo_admin_ui/;
        }

        location ~ ^/(categories|datasets|my-datasets|profile|notifications|users|subscriptions|reviews|login|logout|access-requests)(/.*)?$ {
            proxy_pass http://ppo_legacy_ui$uri;
        }

        location = /mirror {
            return 302 /mirror/;
        }

        location /mirror/static/ {
            alias /usr/share/nginx/html/static/;
            expires 1h;
            add_header Cache-Control "public";
        }

        location = /mirror/reserved {
            return 302 /mirror/reserved/;
        }

        location /mirror/reserved/ {
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter 'href="/' 'href="/mirror/';
            sub_filter 'src="/' 'src="/mirror/';
            try_files /static/index.html =404;
        }

        location = /mirror/managment {
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter 'href="/' 'href="/mirror/';
            sub_filter 'src="/' 'src="/mirror/';
            try_files /static/managment.html =404;
        }

        location = /mirror/managment/ {
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter 'href="/' 'href="/mirror/';
            sub_filter 'src="/' 'src="/mirror/';
            try_files /static/managment.html =404;
        }

        location = /mirror/documentation {
            default_type text/markdown;
            charset utf-8;
            add_header Content-Type "text/markdown; charset=utf-8" always;
            add_header Cache-Control "no-cache";
            try_files /readme.md =404;
        }

        location = /mirror/api/v1 {
            default_type text/html;
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter 'href="/api/v1' 'href="/mirror/api/v1';
            sub_filter 'src="/api/v1' 'src="/mirror/api/v1';
            try_files /static/swagger/v1.html =404;
        }

        location = /mirror/api/v2 {
            default_type text/html;
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter 'href="/api/v2' 'href="/mirror/api/v2';
            sub_filter 'src="/api/v2' 'src="/mirror/api/v2';
            try_files /static/swagger/v2.html =404;
        }

        location /mirror/api/v1/ {
            rewrite ^/mirror(/api/v1/.*)$ $1 break;
            proxy_pass http://$mirror_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_no_cache $skip_cache;
            proxy_cache_bypass $skip_cache;
            proxy_cache ppo_cache;
            add_header X-Upstream-Pool $mirror_api_upstream always;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location /mirror/api/v2/ {
            rewrite ^/mirror(/api/v2/.*)$ $1 break;
            proxy_pass http://$mirror_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_no_cache $skip_cache;
            proxy_cache_bypass $skip_cache;
            proxy_cache ppo_cache;
            add_header X-Upstream-Pool $mirror_api_upstream always;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location /mirror/swagger/ {
            rewrite ^/mirror(/swagger/.*)$ $1 break;
            proxy_pass http://ppo_api_write_mirror/swagger/;
            add_header X-Upstream-Pool ppo_api_write_mirror always;
        }

        location /mirror/legacy/ {
            rewrite ^/mirror/legacy(/.*)$ $1 break;
            proxy_pass http://ppo_legacy_ui_mirror;
            add_header X-Upstream-Pool legacy-mirror always;
        }

        location ~ ^/mirror/(categories|datasets|my-datasets|profile|notifications|users|subscriptions|reviews|login|logout|access-requests)(/.*)?$ {
            rewrite ^/mirror(/.*)$ $1 break;
            proxy_pass http://ppo_legacy_ui_mirror$uri;
        }

        location /mirror/ {
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter 'href="/' 'href="/mirror/';
            sub_filter 'src="/' 'src="/mirror/';
            try_files $uri $uri/ /static/index.html;
        }

        location / {
            try_files $uri @ppo_api_fallback;
        }

        location @ppo_api_fallback {
            proxy_pass http://ppo_api_write;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_no_cache $skip_cache;
            proxy_cache_bypass $skip_cache;
            proxy_cache ppo_cache;
            add_header X-Upstream-Pool ppo_api_write always;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location = /status {
            stub_status;
            access_log off;
        }

        location = /monitoring {
            return 302 /monitoring/;
        }

        location /monitoring/ {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /monitoring;
            proxy_set_header X-Script-Name /monitoring;
            proxy_redirect off;
        }

        error_page 405 = @write_only;
        location @write_only {
            return 405 "Write operations are allowed only on primary backend";
        }
    }
}
