database:
  dsn: "postgres://postgres:pass@localhost:5433/ppo?sslmode=disable"
  max_conns: 20
  min_conns: 2
  max_conn_idle_time: "60s"
  health_check_period: "30s"
  connect_timeout: "5s"

http:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "5s"
  write_timeout: "10s"

storage:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  region: "us-east-1"
  bucket: ""

log:
  level: "info"
  format: ""
  time_format: "2006-01-02T15:04:05.000Z07:00"
  file: "./logs/app.log"

techui:
  host: "0.0.0.0"
  port: 8090

auth:
  secret: "secret"
  access_token_ttl: "24h"
  twofa:
    code_ttl: "5m"
    max_attempts: 3
    block_duration: "1m"
    debug_secret: ""
    delivery: "disabled"

admin:
  username: "admin"
  email: "admin@example.com"
  password: "admin123"
  country: "ru"

cli:
  api_base_url: "http://localhost:8080/api/v2"
  token_file: ""

broker:
  url: "amqp://guest:guest@localhost:5672/"
  gateway_to_core_queue: "gateway.core.cmd"
  core_to_gateway_queue: "core.gateway.evt"
  core_to_data_queue: "core.data.cmd"
  data_to_core_queue: "data.core.evt"
  prefetch: 10
  reconnect_delay: "2s"
  message_process_timeout: "10s"
  enable_dlq: true

external:
  catfacts:
    mode: "mock"                     
    real_base_url: "https://catfact.ninja"
    mock_base_url: "http://localhost:9099"
    timeout: "4s"
  openai:
    mode: "mock"                    
    base_url: "http://localhost:18088"
    api_key: ""
    model: "gpt-3.5-turbo"
    timeout: "15s"
    max_tokens: 120
