database:
  dsn: "postgres://postgres:pass@localhost:5433/ppo?sslmode=disable"
  max_conns: 20
  min_conns: 2
  max_conn_idle_time: "60s"
  health_check_period: "30s"
  connect_timeout: "5s"

mongo:
  uri: "mongodb://localhost:27017"
  database: "myappdb"

http:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "5s"
  write_timeout: "10s"

storage:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  region: "us-east-1"
  bucket: "mybucket"

log:
  level: "info"
  format: ""
  time_format: "2006-01-02T15:04:05.000Z07:00"
  file: "./logs/app.log"

techui:
  host: "0.0.0.0"
  port: 8090

auth:
  secret: "change-me"
  access_token_ttl: "24h"

cli:
  api_base_url: "http://localhost:8080/api/v2"
  token_file: ""
