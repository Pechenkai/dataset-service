openapi: 3.0.3
info:
  title: CatFacts API (public contract)
  version: "1.0.0"
  description: |
    Минимальный контракт внешнего сервиса CatFacts, который используется в проекте.
servers:
  - url: https://catfact.ninja
paths:
  /fact:
    get:
      summary: Get random cat fact
      description: Возвращает случайный факт о котах. Не требует аутентификации.
      responses:
        "200":
          description: Успешный ответ с фактом.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactResponse'
        "429":
          description: Лимит запросов превышен.
components:
  schemas:
    FactResponse:
      type: object
      required: [fact, length]
      properties:
        fact:
          type: string
          example: Cats can rotate their ears 180 degrees thanks to 32 muscles in each ear.
        length:
          type: integer
          description: Длина строки факта.
