      description: Возвращает пользователей с базовыми фильтрами. Доступно только администраторам.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Количество пользователей на странице.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Смещение для пагинации.
        - in: query
          name: role
          schema:
            type: string
            enum: [guest, user, admin]
          description: Фильтр по роли.
        - in: query
          name: email
          schema:
            type: string
            format: email
          description: Поиск по email.
        - in: query
          name: country
          schema:
            type: string
          description: Фильтр по стране.
        - in: query
          name: is_blocked
          schema:
            type: boolean
          description: Фильтр по статусу блокировки.
      responses:
        "200":
          description: Список пользователей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        "400":
          description: Неверные параметры.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Требуется аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Доступ запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Users]
      summary: Register user
      description: |-
        Регистрирует нового пользователя платформы.
        Роль всегда назначается автоматически (`user`), независимо от переданных данных.
      security: []
      requestBody:
        required: true
        content:
          application/json:
