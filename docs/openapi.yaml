              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Доступ запрещён (нет прав на просмотр подписок указанного пользователя).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Пользователь не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
