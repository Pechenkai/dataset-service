openapi: 3.1.1
info:
  title: Dataset Platform Public API
  version: "1.0.0"
  description: |
    REST API сервиса для публикации и распространения датасетов.
servers:
  - url: https://api.dataset-platform.local
    description: Production
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Categories
    description: Управление доменными категориями датасетов.
  - name: Datasets
    description: CRUD-операции над датасетами.
  - name: Versions
    description: Управление версиями датасетов.
  - name: Notifications
    description: Работа с уведомлениями пользователей.
  - name: Reviews
    description: Работа с пользовательскими отзывами и рейтингами.
  - name: Subscriptions
    description: Подписки пользователей на датасеты.
  - name: AccessRequests
    description: Запросы доступа к приватным датасетам.
  - name: Users
    description: Управление пользователями платформы.
  - name: Auth
    description: Аутентификация и управление токенами доступа.
security:
  - bearerAuth: []
paths:
  /api/v2/categories:
    get:
      tags: [Categories]
      summary: List categories
      description: Возвращает страницы категорий с возможностью поиска по названию.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: query
          name: limit
          description: Количество элементов на странице.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          description: Смещение для пагинации.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: search
          description: Фильтр по части названия категории.
          schema:
            type: string
      responses:
        "200":
          description: Список категорий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
        "400":
          description: Неверные параметры.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Categories]
      summary: Create category
      description: Создаёт новую категорию для классификации датасетов. Доступно только администраторам.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        "201":
          description: Категория создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        "400":
          description: Неверные данные запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Требуется аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Доступ запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Категория с таким названием уже существует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/categories/{categoryId}:
    parameters:
      - in: path
        name: categoryId
        description: Идентификатор категории.
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Categories]
      summary: Get category
      description: Возвращает категорию по идентификатору.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Категория найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        "400":
          description: Некорректный идентификатор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Категория не найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Categories]
      summary: Update category
      description: Частично обновляет поля категории. Доступно только администраторам.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        "200":
          description: Категория обновлена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        "400":
          description: Неверные данные запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Требуется аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Доступ запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Категория не найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Конфликт уникальности.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Categories]
      summary: Delete category
      description: Удаляет категорию по идентификатору. Доступно только администраторам.
      responses:
        "204":
          description: Категория удалена.
        "401":
          description: Требуется аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Доступ запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Категория не найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/datasets:
    get:
      tags: [Datasets]
      summary: List datasets
      description: |-
        Возвращает страницу датасетов с фильтрами по владельцу, категории и доступности.
        Анонимные запросы всегда получают только публичные датасеты (любой указанный `owner_id` или `is_public=false` игнорируется).
        Чтобы увидеть непубличные записи, необходимо выполнить запрос от имени владельца датасета или администратора;
        попытка получить такие данные без необходимых прав заканчивается ошибкой 403. В ответ встроено поле `rating_summary`,
        которое кэширует средний рейтинг и количество отзывов для быстрого фильтра и сортировки.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: query
          name: limit
          description: Количество элементов на странице.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - in: query
          name: offset
          description: Смещение для пагинации.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: category_id
          description: Фильтр по категории.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: owner_id
          description: >-
            Фильтр по владельцу. Применяется только для администратора или самого владельца.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: is_public
          description: >-
            Возвращать только публичные датасеты. Значение false доступно только владельцу и администратору.
          schema:
            type: boolean
        - in: query
          name: search
          description: Поиск по названию или описанию.
          schema:
            type: string
        - in: query
          name: min_rating
          description: Минимальное среднее значение рейтинга.
          schema:
            $ref: '#/components/schemas/Rating'
        - in: query
          name: max_rating
          description: Максимальное среднее значение рейтинга.
          schema:
            $ref: '#/components/schemas/Rating'
      responses:
        "200":
          description: Список датасетов вместе с агрегированным рейтингом.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetsResponse'
        "401":
          description: Требуется аутентификация для доступа к непубличным датасетам.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Токен не принадлежит владельцу и не обладает правами администратора.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Неверные параметры.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Datasets]
      summary: Create dataset
      description: Загружает новый датасет вместе с начальной версией.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateDatasetRequest'
      responses:
        "201":
          description: Датасет создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        "400":
          description: Неверные данные запроса или файл.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Требуется аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Датасет с таким именем уже существует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/datasets/{datasetId}:
    parameters:
      - in: path
        name: datasetId
        description: Идентификатор датасета.
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Datasets]
      summary: Get dataset
      description: |-
        Возвращает информацию о датасете, включая кэшированную сводку рейтинга.
        Публичные датасеты доступны всем, но для приватных требуется авторизация владельца или администратора.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Датасет найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        "401":
          description: Требуется аутентификация для доступа к приватному датасету.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Недостаточно прав для просмотра приватного датасета.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Датасет не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Datasets]
      summary: Update dataset
      description: Частично обновляет метаданные датасета. Доступно владельцу датасета и администраторам.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetRequest'
      responses:
        "200":
          description: Датасет обновлён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        "400":
          description: Неверные данные запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Требуется аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Доступ запрещён (недостаточно прав для изменения указанного датасета).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Датасет не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Конфликт уникальности.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Datasets]
      summary: Delete dataset
      description: Удаляет датасет и все связанные версии. Доступно владельцу датасета и администраторам.
      responses:
        "204":
          description: Датасет удалён.
        "401":
          description: Требуется аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Доступ запрещён (недостаточно прав для удаления указанного датасета).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Датасет не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/datasets/{datasetId}/versions:
    parameters:
      - in: path
        name: datasetId
        description: Идентификатор датасета.
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Versions]
      summary: List dataset versions
      description: Возвращает список версий выбранного датасета.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Количество версий на странице.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Смещение для пагинации.
      responses:
        "200":
          description: Список версий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionsResponse'
        "401":
          description: Требуется аутентификация для доступа к приватным версиям.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Недостаточно прав для просмотра версий приватного датасета.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Датасет не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Versions]
      summary: Add dataset version
      description: Загружает новую версию файла для выбранного датасета. Доступно владельцу датасета и администраторам.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateDatasetVersionRequest'
      responses:
        "201":
          description: Версия добавлена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionResponse'
        "400":
          description: Неверные данные запроса или файл.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Требуется аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Доступ запрещён (нет прав на обновление выбранного датасета).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Датасет не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/datasets/{datasetId}/versions/{versionId}:
    parameters:
      - in: path
        name: datasetId
        required: true
        description: Идентификатор датасета.
        schema:
          type: integer
          minimum: 1
      - in: path
        name: versionId
        required: true
        description: Идентификатор версии.
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Versions]
      summary: Get dataset version
      description: Возвращает информацию о конкретной версии датасета.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Версия найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionResponse'
        "401":
          description: Требуется аутентификация для приватного датасета.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Недостаточно прав для просмотра указанной версии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Датасет или версия не найдены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/datasets/{datasetId}/versions/{versionId}/content:
    parameters:
      - in: path
        name: datasetId
        required: true
        description: Идентификатор датасета.
        schema:
          type: integer
          minimum: 1
      - in: path
        name: versionId
        required: true
        description: Идентификатор версии.
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Versions]
      summary: Download dataset version
      description: |-
        Возвращает бинарное содержимое указанной версии датасета.
        Для приватных датасетов требуется авторизация владельца или администратора.
        Если файл хранится во внешнем S3-совместимом хранилище, сервер может вернуть подписанную ссылку с редиректом 302.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Бинарное содержимое датасета (прямая выдача файла).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Клиенту следует перейти по предоставленной подписанной ссылке (Location) для скачивания.
        "401":
          description: Требуется аутентификация для приватной версии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Недостаточно прав для скачивания указанной версии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Датасет или версия не найдены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/datasets/{datasetId}/notifications:
    parameters:
      - in: path
        name: datasetId
        required: true
        description: Идентификатор датасета.
        schema:
          type: integer
          minimum: 1
    post:
      tags: [Notifications]
      summary: Create dataset notification
      description: |-
        Создаёт уведомление, адресованное подписчикам выбранного датасета, и сохраняет его в журнале уведомлений.
        Доступно владельцу датасета и администраторам; доставка подписчикам выполняется асинхронно.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifySubscribersRequest'
      responses:
        "201":
          description: Уведомление создано.
          headers:
            Location:
              description: URI созданного уведомления.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        "400":
          description: Неверные данные запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Требуется аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Доступ запрещён (нет прав на рассылку подписчикам указанного датасета).
          content:
            application/json:
