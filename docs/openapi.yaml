              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/auth/tokens:
    post:
      tags: [Auth]
      summary: Issue access token
      description: Аутентифицирует пользователя и возвращает токен доступа.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateRequest'
      responses:
        "200":
          description: Токен выдан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'
        "400":
          description: Неверные данные запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Неверные учётные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v2/auth/tokens/revoke:
    post:
      tags: [Auth]
      summary: Revoke access token
      description: >-
        Инвалидация ранее выданного токена доступа.
        Идентификатор токена передаётся только в теле запроса, чтобы не логировать его в URL.
        Если `token_id` не указан, отзывается текущий токен из заголовка Authorization.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeTokenRequest'
      responses:
        "204":
          description: Токен отозван или будет отозван асинхронно.
        "400":
          description: Некорректный идентификатор токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Требуется аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Токен не найден или уже отозван.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: validation_error
        message:
          type: string
          example: "Поле name обязательно"
    PaginationMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
          example: 120
        limit:
          type: integer
          minimum: 0
          example: 20
        offset:
          type: integer
          minimum: 0
          example: 0
    CategoryResponse:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          maxLength: 50
          example: Геопространственные данные
        description:
          type: string
          maxLength: 255
          example: Датасеты с географической привязкой
    CategoriesResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 255
    UpdateCategoryRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 255
    DatasetMetadata:
      type: object
      properties:
        format:
          type: string
          example: csv
        tags:
          type: array
          items:
            type: string
        size:
          type: integer
          description: Размер в байтах.
    DatasetResponse:
      type: object
      required: [id, name, category_id, owner_id, is_public]
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: Данные о трафике
        description:
          type: string
          maxLength: 2000
        category_id:
          type: integer
        owner_id:
          type: integer
        is_public:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        latest_version:
          $ref: '#/components/schemas/DatasetVersionResponse'
        metadata:
          $ref: '#/components/schemas/DatasetMetadata'
          readOnly: true
          description: >-
            Метаданные последней версии датасета (копируются из соответствующей записи о версии).
        rating_summary:
          $ref: '#/components/schemas/DatasetRatingSummary'
    DatasetRatingSummary:
      type: object
      required: [average, count, synced_at]
      properties:
        average:
          type: number
          format: float
          description: Средний рейтинг на момент синхронизации.
        count:
          type: integer
          description: Количество учтённых отзывов.
        synced_at:
          type: string
          format: date-time
          description: Время последней синхронизации значения.
    DatasetsResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DatasetResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateDatasetRequest:
      type: object
      required: [name, category_id, file]
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        category_id:
          type: integer
        is_public:
          type: boolean
          default: false
        file:
          type: string
          format: binary
          description: Архив или файл с данными.
        metadata:
          $ref: '#/components/schemas/DatasetMetadata'
          description: Метаданные, которые будут закреплены за первой версией датасета.
    UpdateDatasetRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        category_id:
          type: integer
        is_public:
          type: boolean
    DatasetVersionResponse:
      type: object
      required: [id, dataset_id, number]
      properties:
        id:
          type: integer
        dataset_id:
          type: integer
        number:
          type: string
          example: v2.1
        change_log:
          type: string
        file_url:
          type: string
          format: uri
          description: >-
            Прямая ссылка на файл версии. Клиент может использовать этот URL или эндпоинт
            `GET /api/v2/datasets/{datasetId}/versions/{versionId}/content` для скачивания;
            ссылка может быть подписанной и иметь ограниченный срок действия.
        upload_date:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/DatasetMetadata'
          description: >-
            Источник истины: обновления метаданных выполняются только через версии датасета.
    DatasetVersionsResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DatasetVersionResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateDatasetVersionRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        change_log:
          type: string
        metadata:
          $ref: '#/components/schemas/DatasetMetadata'
          description: Метаданные, которые заменят значения в датасете после публикации версии.
    NotifySubscribersRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 2000
    NotificationResponse:
      type: object
      required: [id, user_id, message, is_read]
      properties:
        id:
          type: integer
        dataset_id:
          type: integer
        user_id:
          type: integer
        message:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
    NotificationsResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    NotificationPatchRequest:
      type: object
      required: [is_read]
      properties:
        is_read:
          type: boolean
    Rating:
      type: integer
      enum: [1, 2, 3, 4, 5]
    ReviewResponse:
      type: object
      required: [id, dataset_id, user_id, rating]
      properties:
        id:
          type: integer
        dataset_id:
          type: integer
        user_id:
          type: integer
        rating:
          $ref: '#/components/schemas/Rating'
        text:
          type: string
          maxLength: 1000
        created_at:
          type: string
          format: date-time
    ReviewsResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateReviewRequest:
      type: object
      required: [dataset_id, rating]
      properties:
        dataset_id:
          type: integer
        rating:
          $ref: '#/components/schemas/Rating'
        text:
          type: string
          maxLength: 1000
    UpdateReviewRequest:
      type: object
      minProperties: 1
      properties:
        rating:
          $ref: '#/components/schemas/Rating'
        text:
          type: string
          maxLength: 1000
    SubscriptionResponse:
      type: object
      required: [id, dataset_id, user_id]
      properties:
        id:
          type: integer
        dataset_id:
          type: integer
        user_id:
          type: integer
        subscribed_at:
          type: string
          format: date-time
    SubscriberResponse:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer
    SubscribersResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriberResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    SubscriptionsResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateSubscriptionRequest:
      type: object
      required: [dataset_id]
      properties:
        dataset_id:
          type: integer
        user_id:
          type: integer
          description: >-
            Необязательное поле. Разрешено только администраторам для создания подписки за другого пользователя.
    AccessRequestResponse:
      type: object
      required: [id, dataset_id, user_id, status, created_at]
      properties:
        id:
          type: integer
        dataset_id:
          type: integer
        user_id:
          type: integer
        status:
          type: string
          enum: [pending, approved, denied]
        created_at:
          type: string
          format: date-time
    AccessRequestsResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessRequestResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateAccessRequest:
      type: object
      required: [dataset_id]
      properties:
        dataset_id:
          type: integer
          minimum: 1
          description: Идентификатор приватного датасета.
    UpdateAccessRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, denied]
          description: Новый статус запроса доступа.
