                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: validation_error
        message:
          type: string
          example: "Поле name обязательно"
    PaginationMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
          example: 120
        limit:
          type: integer
          minimum: 0
          example: 20
        offset:
          type: integer
          minimum: 0
          example: 0
    CategoryResponse:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          maxLength: 50
          example: Геопространственные данные
        description:
          type: string
          maxLength: 255
          example: Датасеты с географической привязкой
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CategoriesResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 255
    UpdateCategoryRequest:
      type: object
      minProperties: 1
