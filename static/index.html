<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PPO Dataset Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        body {
            margin: 0;
            background: #f7fbff;
            color: #0f172a;
        }
        header {
            padding: 3rem 1.5rem;
            text-align: center;
            background: radial-gradient(circle at top, #e0efff, #f7fbff);
        }
        main {
            padding: 2rem 1.5rem 4rem;
        }
        h1 {
            margin-bottom: 0.5rem;
            font-size: clamp(2rem, 4vw, 3.2rem);
        }
        p.lead {
            max-width: 720px;
            margin: 0 auto;
            font-size: 1.1rem;
            color: #475569;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-top: 3rem;
        }
        figure {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 1rem;
            margin: 0;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.1);
        }
        figure img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.35);
        }
        figcaption {
            margin-top: 0.8rem;
            font-size: 0.95rem;
            color: #475569;
        }
        nav {
            text-align: center;
            margin-top: 2rem;
        }
        nav a {
            display: inline-block;
            margin: 0.4rem 0.6rem;
            padding: 0.6rem 1.3rem;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.6);
            color: #0f172a;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        nav a:hover {
            background: rgba(148, 163, 184, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<header>
    <h1>PPO Dataset Platform</h1>
    <p class="lead">Платформа для публикации, версионирования и совместного использования ML-датасетов.</p>
    <nav>
        <a href="/managment">Панель управления</a>
        <a href="/api/v2">Swagger API v2</a>
        <a href="/legacy/">Текущий интерфейс</a>
    </nav>
</header>
<main>
    <div class="gallery">
        <figure>
            <img src="/static/img/screen.jpg" alt="Набросок главной страницы" />
            <figcaption>Главный экран WebLab#1 с быстрым доступом к свежим датасетам.</figcaption>
        </figure>
        <figure>
            <img src="/static/img/use_case.png" alt="Use-case диаграмма" />
            <figcaption>Use-case диаграмма, описывающая ключевые действия акторов.</figcaption>
        </figure>
        <figure>
            <img src="/static/img/level.png" alt="Компонентная диаграмма" />
            <figcaption>Компонентная диаграмма взаимодействий подсистем сервиса.</figcaption>
        </figure>
    </div>
</main>
</body>
</html>
