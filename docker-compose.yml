version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ppo_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: ppo
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - ppo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ppo_pg_data: