services:
  db:
    image: postgres:15
    container_name: ppo_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: ppo
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - ppo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6
    container_name: ppo_mongo
    ports:
      - "27017:27017"
    volumes:
      - ppo_mongo_data:/data/db
      - ./mongo-migrations:/docker-entrypoint-initdb.d
    environment:
      MONGO_INITDB_DATABASE: myappdb
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })" ]
      interval: 5s
      timeout: 5s
      retries: 5
      
  minio:
    image: quay.io/minio/minio
    container_name: ppo_minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ppo_minio_data:/data

  api:
    build: .
    image: ppo-app
    container_name: ppo_api
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
      minio:
        condition: service_started
    environment:
      DATABASE_DSN: postgres://postgres:pass@db:5432/ppo?sslmode=disable
      MONGO_URI: mongodb://mongo:27017
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: mybucket
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      TECHUI_HOST: 0.0.0.0
      TECHUI_PORT: 8090
      CLI_API_BASE_URL: http://nginx/api/v2
    expose:
      - "8080"

  legacy-ui:
    image: ppo-app
    container_name: ppo_legacy_ui
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
      minio:
        condition: service_started
    environment:
      MODE: gui
      DATABASE_DSN: postgres://postgres:pass@db:5432/ppo?sslmode=disable
      MONGO_URI: mongodb://mongo:27017
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: mybucket
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      TECHUI_HOST: 0.0.0.0
      TECHUI_PORT: 8090
    expose:
      - "8090"

  adminer:
    image: adminer:4
    container_name: ppo_adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    container_name: ppo_gateway
    depends_on:
      - api
      - legacy-ui
      - adminer
    ports:
      - "8088:80"

volumes:
  ppo_pg_data:
  ppo_mongo_data:
  ppo_minio_data:
